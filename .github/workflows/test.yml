name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Qt runtime libraries (window tests run offscreen)
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install pytest PyQt6 .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: CLI smoke test
        run: |
          btwctl --version
          btwctl --help >/dev/null
          python -m btwctl --help >/dev/null

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends zsh fish
      - run: |
          bash -n completions/btwctl.bash
          zsh -n completions/_btwctl
          fish --no-execute completions/btwctl.fish
          sh -n install-files.sh
          sh -n install.sh
          sh -n ci-install-check.sh
          python3 tools/update-translations.py --check
          for f in packaging/*.sh; do sh -n "$f"; done

  # Follow the README's install steps exactly, on the distributions it names.
  install-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - name: README steps
        run: |
          sudo apt-get install -y git pipx libusb-1.0-0
          sudo ./install.sh
      - name: Qt runtime libraries and checkers for the smoke test
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 desktop-file-utils
      - run: ./ci-install-check.sh
      - run: systemd-analyze --user verify /usr/lib/systemd/user/btwctl-monitor.service
      - name: uninstall leaves nothing behind
        run: |
          sudo ./install.sh --uninstall
          ! command -v btwctl
          test ! -e /opt/btwctl
          test ! -e /usr/lib/udev/rules.d/70-btwctl.rules
          test ! -e /usr/share/applications/btwctl.desktop

  install-fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:latest
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v5
      - name: README steps (as root in the container, so without sudo)
        run: |
          dnf install -y git pipx libusb1
          ./install.sh
      - name: Qt runtime libraries and checkers for the smoke test
        run: dnf install -y mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs desktop-file-utils
      - run: ./ci-install-check.sh
      - name: uninstall leaves nothing behind
        run: |
          ./install.sh --uninstall
          ! command -v btwctl
          test ! -e /opt/btwctl
          test ! -e /usr/lib/udev/rules.d/70-btwctl.rules

  # Build the packages, install them like a user would, check, remove.
  package-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential debhelper dh-python python3-pytest
      - run: packaging/build-deb.sh dist
      - name: Source package builds too (what a Launchpad PPA builds from)
        run: |
          cp -r . /tmp/srcpkg && cd /tmp/srcpkg && rm -rf .git dist
          dpkg-buildpackage -S -us -uc -d
          ls ../btwctl_*.dsc
      - run: sudo apt-get install -y ./dist/btwctl_*_all.deb
      - run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 desktop-file-utils
      - run: EXPECT_BIN=/usr/bin/btwctl PYTHON=/usr/bin/python3 ./ci-install-check.sh
      - run: |
          sudo apt-get remove -y btwctl
          ! command -v btwctl
          test ! -e /usr/lib/udev/rules.d/70-btwctl.rules
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  package-rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:latest
    steps:
      - run: dnf install -y git rpm-build python3-devel systemd-rpm-macros
      - uses: actions/checkout@v5
      - run: packaging/build-rpm.sh dist
      - name: COPR path builds too (source RPM via .copr/Makefile, then rebuild)
        run: |
          dnf install -y make
          make -f .copr/Makefile srpm outdir=/tmp/srpm
          rpmbuild --rebuild /tmp/srpm/btwctl-*.src.rpm
      - run: dnf install -y ./dist/btwctl-*.noarch.rpm
      - run: dnf install -y mesa-libEGL mesa-libGL libxkbcommon fontconfig desktop-file-utils
      - run: EXPECT_BIN=/usr/bin/btwctl PYTHON=/usr/bin/python3 ./ci-install-check.sh
      - run: |
          dnf remove -y btwctl
          ! command -v btwctl
          test ! -e /usr/lib/udev/rules.d/70-btwctl.rules
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  package-arch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git
      - uses: actions/checkout@v5
      - run: packaging/build-arch.sh dist
      - run: pacman -U --noconfirm dist/btwctl-*-any.pkg.tar.zst
      - run: pacman -S --noconfirm --needed desktop-file-utils mesa libxkbcommon fontconfig
      - run: EXPECT_BIN=/usr/bin/btwctl PYTHON=/usr/bin/python ./ci-install-check.sh
      - run: |
          pacman -R --noconfirm btwctl
          ! command -v btwctl
          test ! -e /usr/lib/udev/rules.d/70-btwctl.rules
