name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Qt runtime libraries (window tests run offscreen)
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install pytest PyQt6 .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: CLI smoke test
        run: |
          btw5-switch --version
          btw5-switch --help >/dev/null
          python -m btw5 --help >/dev/null

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends zsh fish
      - run: |
          bash -n completions/btw5-switch.bash
          zsh -n completions/_btw5-switch
          fish --no-execute completions/btw5-switch.fish
          sh -n install-files.sh
          sh -n install.sh
          sh -n ci-install-check.sh

  # Follow the README's install steps exactly, on the distributions it names.
  install-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - name: README steps
        run: |
          sudo apt-get install -y git pipx libusb-1.0-0
          sudo ./install.sh
      - name: Qt runtime libraries and checkers for the smoke test
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 desktop-file-utils
      - run: ./ci-install-check.sh
      - run: systemd-analyze --user verify /usr/lib/systemd/user/btw5-switch-monitor.service
      - name: uninstall leaves nothing behind
        run: |
          sudo ./install.sh --uninstall
          ! command -v btw5-switch
          test ! -e /opt/btw5-switch
          test ! -e /usr/lib/udev/rules.d/70-btw5-switch.rules
          test ! -e /usr/share/applications/btw5-switch.desktop

  install-fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:latest
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v5
      - name: README steps (as root in the container, so without sudo)
        run: |
          dnf install -y git pipx libusb1
          ./install.sh
      - name: Qt runtime libraries and checkers for the smoke test
        run: dnf install -y mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs desktop-file-utils
      - run: ./ci-install-check.sh
      - name: uninstall leaves nothing behind
        run: |
          ./install.sh --uninstall
          ! command -v btw5-switch
          test ! -e /opt/btw5-switch
          test ! -e /usr/lib/udev/rules.d/70-btw5-switch.rules

  # Build the packages, install them like a user would, check, remove.
  package-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: packaging/build-deb.sh dist
      - run: sudo apt-get update && sudo apt-get install -y ./dist/btw5-switch_*_all.deb
      - run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 desktop-file-utils
      - run: EXPECT_BIN=/usr/bin/btw5-switch PYTHON=/usr/bin/python3 ./ci-install-check.sh
      - run: |
          sudo apt-get remove -y btw5-switch
          ! command -v btw5-switch
          test ! -e /usr/lib/udev/rules.d/70-btw5-switch.rules
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  package-rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:latest
    steps:
      - run: dnf install -y git rpm-build python3-devel systemd-rpm-macros
      - uses: actions/checkout@v5
      - run: packaging/build-rpm.sh dist
      - run: dnf install -y ./dist/btw5-switch-*.noarch.rpm
      - run: dnf install -y mesa-libEGL mesa-libGL libxkbcommon fontconfig desktop-file-utils
      - run: EXPECT_BIN=/usr/bin/btw5-switch PYTHON=/usr/bin/python3 ./ci-install-check.sh
      - run: |
          dnf remove -y btw5-switch
          ! command -v btw5-switch
          test ! -e /usr/lib/udev/rules.d/70-btw5-switch.rules
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
