[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "btwctl"
dynamic = ["version"]
description = "Control the Creative BT-W5 and BT-W6 Bluetooth audio dongles (aptX mode, HFP, pairing, headset switching)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyusb"]

[project.optional-dependencies]
gui = ["PyQt6"]
tray = ["PyQt6"]

[project.scripts]
btwctl = "btwctl.cli:main"
btw5-switch = "btwctl.cli:main"   # the name before 0.7

[project.urls]
Homepage = "https://github.com/doodersrage/btwctl"

[tool.setuptools]
packages = ["btwctl"]

[tool.setuptools.package-data]
btwctl = ["locale/*.po", "locale/*.pot"]

[tool.setuptools.dynamic]
version = {attr = "btwctl.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 60  # dump tracebacks if a test hangs
